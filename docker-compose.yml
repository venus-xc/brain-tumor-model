version: '3.8'

services:
  brain-tumor-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain_tumor_workstation
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
    volumes:
      # Persist generated diagnostic reports and model weights
      - reports_data:/app/app/static/reports
      - weights_data:/app/weights
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  reports_data:
  weights_data:
